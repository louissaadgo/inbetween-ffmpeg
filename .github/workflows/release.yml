# Builds FFmpeg for Inbetween and publishes it: pushing a tag v<VERSION>
# (VERSION's) makes a GitHub release holding the Windows zip, its complete
# source (every source archive and build.sh) and SHA256SUMS. Run by hand
# (Actions › release › Run workflow), it only builds, and keeps out/ as the
# run's artifact.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 \
            mingw-w64-x86-64-dev nasm meson ninja-build pkg-config make zip curl
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32 || true
      - name: Build
        run: ./build.sh
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: inbetween-ffmpeg
          path: out/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip out/*.tar out/SHA256SUMS \
            --title "FFmpeg $(cat VERSION) for Inbetween" --notes-file out/RELEASE-NOTES.md
